<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fake Player</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #111; color: #eee; }
  #player { position: relative; width: 640px; height: 360px; background: #000; margin: 16px; }
  #player video { width: 100%; height: 100%; }
  #controls { margin: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  button { padding: 6px 10px; }
  #status { margin: 16px; font: 13px ui-monospace, monospace; white-space: pre; }
  #up-next:not(:empty) { position: absolute; right: 16px; bottom: 16px; background: #222; padding: 12px; border: 1px solid #555; }
</style>
</head>
<body>
  <h1 id="title">Episode</h1>
  <div id="player">
    <!-- Mirrors HBO Max: an always-present placeholder that fills with a dismissable countdown. -->
    <div id="up-next" data-testid="up_next"></div>
  </div>
  <div id="controls">
    <button id="play">Play</button>
    <button id="pause">Pause</button>
    <button id="seek-back">−60s</button>
    <button id="seek-fwd">+60s</button>
    <button id="recreate">Recreate element</button>
    <button id="ad-break">Simulate ad break</button>
    <button id="quality">Quality switch</button>
    <button id="next-push">Next episode (pushState)</button>
    <button id="next-load">Next episode (real load)</button>
    <button id="show-up-next">Show up-next countdown</button>
    <button id="fullscreen">Fullscreen</button>
  </div>
  <div id="status"></div>
  <script src="/static/player.js"></script>
</body>
</html>
