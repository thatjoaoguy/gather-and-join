# Fly.io config for a party server that is always up at a stable wss:// address, so
# participants paste the URL into the extension once instead of once per party.
#
#   fly launch --config apps/server/fly.toml --copy-config --no-deploy    # pick your own app name
#   fly deploy --config apps/server/fly.toml --ha=false
#
# You do not need this repository: download this one file and run the same commands.
#
# Fly is not free. The trial is 2 hours of machine runtime or 7 days, whichever comes
# first, after which the app stops until a card is added; the machine below then costs
# roughly $2/month. Render's free tier runs the same image at no cost — see the README.
#
# `--ha=false` is not optional. `fly deploy` creates two machines by default, and rooms
# live in the memory of one process: a second machine silently splits the party in two —
# same room code, different room, and nobody can tell why. There is no fly.toml key that
# caps the machine count, so the flag is the only thing standing between a host and that
# failure. On an app that is already deployed: `fly scale count 1`.

app = "gather-and-join"
primary_region = "iad"          # put it near the people watching, not near you

[build]
  image = "ghcr.io/thatjoaoguy/gather-and-join-server:latest"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true            # the extension needs wss://, which this terminates for you
  auto_start_machines = true
  auto_stop_machines = "off"    # stopping mid-party would drop everyone's WebSocket
  # `min_machines_running` is deliberately absent: Fly only honours it when auto-stop is
  # on, so here it would read like a guarantee of one live machine while doing nothing.
  # Machine count is set by `--ha=false` / `fly scale count 1` — see the top of this file.

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# The smallest machine is plenty: the server relays signaling text and never touches media.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
