# Fly.io config for a party server that is always up at a stable wss:// address, so
# participants paste the URL into the extension once instead of once per party.
#
#   fly launch --config apps/server/fly.toml --copy-config --no-deploy   # pick your own app name
#   fly deploy --config apps/server/fly.toml
#
# You do not need this repository: download this one file and run the same commands.

app = "gather-and-join"
primary_region = "iad"          # put it near the people watching, not near you

[build]
  image = "ghcr.io/thatjoaoguy/gather-and-join-server:latest"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true            # the extension needs wss://, which this terminates for you
  # Rooms live in the memory of one process. A second machine would silently split the
  # party in two — same code, different room — so this never scales past one.
  min_machines_running = 1
  auto_start_machines = true
  auto_stop_machines = "off"    # stopping mid-party would drop everyone's WebSocket

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# The smallest machine is plenty: the server relays signaling text and never touches media.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
