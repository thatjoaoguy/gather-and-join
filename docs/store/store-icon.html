<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gather &amp; Join · Store icon</title>
<link rel="stylesheet" href="../design-system/system.css">
<style>
html, body { width: 128px; height: 128px; margin: 0; background: transparent; }
.store-icon { position: relative; width: 128px; height: 128px; }
.store-icon-bg {
  position: absolute;
  inset: 16px;
  border-radius: 22px;
  background:
    radial-gradient(78px 76px at 18% 12%, #493663 0, transparent 72%),
    radial-gradient(76px 72px at 88% 92%, #56303e 0, transparent 70%),
    var(--surface);
  box-shadow: 0 0 4px #f4f0fa2e;
}
.store-icon img {
  position: absolute;
  inset: 18px;
  width: 92px;
  height: 92px;
  display: block;
}
</style>
</head>
<body>
<div class="store-icon" role="img" aria-label="Gather &amp; Join">
  <div class="store-icon-bg" aria-hidden="true"></div>
  <img src="../design-system/brand/mark.svg" alt="">
</div>
</body>
</html>
