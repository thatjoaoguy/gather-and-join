<!doctype html>
<html lang="en" class="close">
<head>
<meta charset="utf-8">
<title>Gather &amp; Join · Copies differ</title>
<link rel="stylesheet" href="../design-system/system.css">
<link rel="stylesheet" href="../design-system/screens/screens.css">
<link rel="stylesheet" href="shot.css">
</head>
<body>
<!--#icons-->

<div class="shot">
<div class="stage">
<div class="player">
<div class="film photo">
<img src="assets/show-frame-a.png" alt="">
<div class="transport"><span class="glyph">❚❚</span><span class="time">0:12 / 57:22</span><span class="bar"><b style="width:0.35%"></b><i style="left:0.35%"></i></span></div>
</div>
<aside class="rail current has-notice" aria-label="Participants">
<button class="gear" type="button" aria-label="Room settings" aria-expanded="false"><svg aria-hidden="true"><use href="#i-settings"/></svg></button>
<div class="rail-notice warning" role="group" aria-label="Copies differ"><strong><span class="semantic-icon" aria-hidden="true"><svg><use href="#i-warn"/></svg></span>Copies differ by 0:52</strong>
<span>One copy runs 58:14, another 57:22. The longer one skips its extra start, filled in with the difference.</span>
<div class="start-field"><label for="start">Longer copy skips</label><input id="start" type="text" inputmode="decimal" value="0:52"><span class="hint">Minutes and seconds, e.g. 7:04.25</span></div>
<button type="button" class="primary">Align</button></div>
<div class="tile video photo self mirrored"><img src="assets/cam-you.png" alt=""><span class="name">You</span></div>
<div class="tile"><div class="peerlabel"><div class="avatar" aria-hidden="true">S</div><strong>Sam</strong></div></div>
</aside>
</div>
</div>
</div>
</body>
</html>
