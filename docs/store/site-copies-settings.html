<!doctype html>
<html lang="en" class="close">
<head>
<meta charset="utf-8">
<title>Gather &amp; Join · Copies differ, in settings</title>
<link rel="stylesheet" href="../design-system/system.css">
<link rel="stylesheet" href="../design-system/screens/screens.css">
<link rel="stylesheet" href="shot.css">
</head>
<body>
<!--#icons-->

<div class="shot">
<div class="stage">
<div class="player">
<div class="film photo">
<img src="assets/show-frame-a.png" alt="">
<div class="transport"><span class="glyph">❚❚</span><span class="time">0:12 / 57:22</span><span class="bar"><b style="width:0.35%"></b><i style="left:0.35%"></i></span></div>
</div>
<aside class="rail current settings-open" aria-label="Participants">
<div class="settings" role="dialog" aria-label="Room settings">
<header><h2>Room settings</h2><button type="button" class="x" aria-label="Close settings"><svg aria-hidden="true"><use href="#i-close"/></svg></button></header>
<h3>Room</h3>
<div class="row"><span class="code">G7K2MX</span><button type="button">Copy</button></div>
<p class="meta"><span class="chip host">Host</span> Connected · 2 in the room</p>
<h3>Episode</h3>
<p class="service">HBO Max</p>
<p class="title">The Ember Road: Episode 4</p>
<div class="copies" role="group" aria-label="Copies differ">
<strong><span class="semantic-icon" aria-hidden="true"><svg><use href="#i-warn"/></svg></span>Copies differ by 0:52</strong>
<p>One copy runs 58:14, another 57:22.</p>
<div class="start-field"><label for="start">Longer copy skips</label><div class="control"><input id="start" type="text" inputmode="decimal" value="0:46.25"><button type="button" class="clear">Clear</button></div><span class="hint">Minutes and seconds, e.g. 7:04.25</span></div>
</div>
<h3>You</h3>
<div class="toggles"><button type="button" aria-pressed="true"><svg aria-hidden="true"><use href="#i-mic"/></svg>Mic on</button><button type="button" aria-pressed="false"><svg aria-hidden="true"><use href="#i-cam-off"/></svg>Camera off</button></div>
<h3>Server</h3>
<div class="server"><svg aria-hidden="true"><use href="#i-server"/></svg><span class="dot ok" role="img" aria-label="Reachable"></span><span class="host">party.example.com</span></div>
</div>
</aside>
</div>
</div>
</div>
</body>
</html>
