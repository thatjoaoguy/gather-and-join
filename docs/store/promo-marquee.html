<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gather &amp; Join · Marquee promo tile</title>
<link rel="stylesheet" href="../design-system/system.css">
<style>
html, body { width: 1400px; height: 560px; margin: 0; overflow: hidden; }
.marquee {
  position: relative;
  isolation: isolate;
  width: 1400px;
  height: 560px;
  overflow: hidden;
  background:
    radial-gradient(780px 480px at 0 -12%, #2f2342 0, transparent 66%),
    radial-gradient(700px 420px at 106% 115%, #3a2330 0, transparent 68%),
    var(--bg);
}
.scene { position: absolute; inset: 0 0 0 530px; }
.scene img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 20% center; }
.scene::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(to right, var(--bg) 0, #101014db 9%, #10101447 40%, transparent 70%),
    linear-gradient(to top, #10101480, transparent 52%);
}
.copy { position: relative; z-index: 1; width: 660px; padding: 82px 0 0 76px; }
.copy img { display: block; width: 370px; height: auto; }
.copy h1 { margin: 48px 0 18px; font-size: 57px; font-weight: 700; line-height: 1.11; letter-spacing: -.03em; }
.copy h1 em { font-style: normal; color: var(--purple); }
.copy h1 span { color: var(--red); }
.copy p { margin: 0; color: var(--muted); font-size: 21px; font-weight: 600; }
</style>
</head>
<body>
<div class="marquee">
  <div class="scene"><img src="assets/show-frame-a.png" alt=""></div>
  <div class="copy">
    <img src="../design-system/brand/lockup.svg" alt="Gather &amp; Join">
    <h1>Watch in <em>sync.</em><br>Talk in <span>real time.</span></h1>
    <p>One room for the show and your friends.</p>
  </div>
</div>
</body>
</html>
