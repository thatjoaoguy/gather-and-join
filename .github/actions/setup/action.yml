name: 'Setup'
description: 'pnpm, Node and the workspace dependencies, optionally the Playwright browser'
inputs:
  playwright:
    description: 'Install the Playwright Chromium build the harness drives'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    # The pnpm version comes from `packageManager` in package.json; setting it here too fails the step.
    - name: 🧰 Setup pnpm
      uses: pnpm/action-setup@v6

    - name: 🧰 Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: pnpm

    - name: 📥 Install
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: 🎭 Install Playwright Chromium
      if: inputs.playwright == 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
      working-directory: tools/harness
