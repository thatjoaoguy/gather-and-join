name: 'Setup'
description: 'pnpm, Node and the workspace dependencies'
runs:
  using: 'composite'
  steps:
    # The pnpm version comes from `packageManager` in package.json; setting it here too fails the step.
    - name: 🧰 Setup pnpm
      uses: pnpm/action-setup@v6

    - name: 🧰 Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: pnpm

    - name: 📥 Install
      shell: bash
      run: pnpm install --frozen-lockfile
