name: 🧪 Checks
on:
  pull_request:
    branches:
      - docs
  # Pushes to docs run this through deploy-docs.yml, so a failure there stops the deploy.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a PR supersedes the run in progress; docs and deploy runs are never cancelled.
  group: checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v7

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 🔎 Lint
        run: pnpm lint

      - name: 🔎 Typecheck
        run: pnpm typecheck

      # Broken links and anchors fail the build (see onBrokenLinks in docusaurus.config.ts).
      - name: 🏗️ Build
        run: pnpm build

      - name: 📦 Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: build
