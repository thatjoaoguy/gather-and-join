name: 🧪 Tests
on:
  pull_request:
    branches:
      - main
  # Pushes to main run this through release.yml, so a failure there stops the release.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a PR supersedes the run in progress; main and release runs are never cancelled.
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v7

      # The pnpm version comes from `packageManager` in package.json; setting it here too fails the step.
      - name: 🧰 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🧰 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: 📥 Install
        run: pnpm install --frozen-lockfile

      - name: 🎭 Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: tools/harness

      - name: 🔎 Lint
        run: pnpm lint

      - name: 🔎 Typecheck
        run: pnpm typecheck

      - name: 🧪 Unit tests
        run: pnpm test:unit

      - name: 🏗️ Build
        run: pnpm build

      - name: 🧪 End-to-end tests
        run: pnpm test:e2e

      - name: 🧪 Sabotage matrix
        run: pnpm test:sabotage

      - name: 🗂️ Upload e2e results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results
          path: |
            tools/harness/test-results
            tools/harness/observer-logs
