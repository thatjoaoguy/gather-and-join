name: 🧪 Tests
on:
  pull_request:
    branches:
      - main
  # Pushes to main run this through release.yml, so a failure there stops the release.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a PR supersedes the run in progress; main and release runs are never cancelled.
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v7

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 🔎 Lint
        run: pnpm lint

      - name: 🔎 Typecheck
        run: pnpm typecheck

      - name: 🧪 Unit tests
        run: pnpm test:unit

      - name: 🏗️ Build
        run: pnpm build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v7

      - name: 🧰 Setup
        uses: ./.github/actions/setup
        with:
          playwright: true

      - name: 🧪 End-to-end tests
        run: pnpm test:e2e

      - name: 🗂️ Upload e2e results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results
          path: |
            tools/harness/test-results
            tools/harness/observer-logs

  sabotage:
    # One row per runner. Run together on a single 4-vCPU runner, the rows drive
    # 8-12 Chrome instances between them and the timing assertions go flaky.
    name: Sabotage (${{ matrix.flag }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flag: [reattach, drift, offscreen, echo-suppress]
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v7

      - name: 🧰 Setup
        uses: ./.github/actions/setup
        with:
          playwright: true

      - name: 🧪 Sabotage row
        run: pnpm test:sabotage ${{ matrix.flag }}

      - name: 🗂️ Upload sabotage results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sabotage-${{ matrix.flag }}
          path: |
            tools/harness/test-results
            tools/harness/observer-logs
