name: 📦 Package
on:
  workflow_call:
    inputs:
      version:
        description: 'The released version to package (e.g., 1.2.3)'
        required: true
        type: string

jobs:
  package-extension:
    name: Package Extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      releaseVersion: ${{ inputs.version }}
      releaseTag: v${{ inputs.version }}
    steps:
    # The tag points at the release commit, whose package.json carries the new version.
    - name: 📂 Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ env.releaseTag }}

    - name: 🧰 Setup
      uses: ./.github/actions/setup

    # GJ_TEST must stay unset: it adds the test hook and localhost host permissions.
    - name: 📦 Zip Extension
      run: pnpm --filter @gj/extension exec wxt zip

    - name: ✅ Verify Store ZIP
      run: |
        shopt -s nullglob
        archives=(apps/extension/.output/*-chrome.zip)
        if [[ ${#archives[@]} -ne 1 ]]; then
          echo "::error::Expected exactly one chrome ZIP, found ${#archives[@]}"
          exit 1
        fi
        archive="${archives[0]}"

        packedVersion=$(unzip -p "$archive" manifest.json | jq -r '.version')
        if [[ "$packedVersion" != "$releaseVersion" ]]; then
          echo "::error::Manifest version $packedVersion does not match release $releaseVersion"
          exit 1
        fi
        if unzip -p "$archive" manifest.json | grep -q localhost; then
          echo "::error::Manifest references localhost; this is a test build"
          exit 1
        fi

        expected="gather-and-join-$releaseVersion-chrome.zip"
        mv "$archive" "$expected"
        echo "PACKAGE_ARCHIVE=$expected" >> "$GITHUB_ENV"
        echo "✅ Packed \`$expected\`" | tee -a "$GITHUB_STEP_SUMMARY"

    - name: 🗂️ Upload ZIP Artifact
      uses: actions/upload-artifact@v7
      with:
        name: gather-and-join-${{ env.releaseVersion }}-chrome
        path: ${{ env.PACKAGE_ARCHIVE }}

    - name: 📎 Attach ZIP to Release
      run: gh release upload "$releaseTag" "$PACKAGE_ARCHIVE" --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Uploads the ZIP as the store item's draft and stops there: submitting it for review
  # stays a click in the Developer Dashboard, after the smoke test in CHROMEWEBSTORE.md.
  # Keyless: GitHub's OIDC token is exchanged through Workload Identity Federation for a
  # short-lived token of the service account linked to the publisher. Skipped until the
  # repository variables are set, so forks and unconfigured clones stay green.
  upload-extension:
    name: Upload to Chrome Web Store
    needs: package-extension
    if: vars.CWS_EXTENSION_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      releaseVersion: ${{ inputs.version }}
      item: https://chromewebstore.googleapis.com/v2/publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_EXTENSION_ID }}
      upload: https://chromewebstore.googleapis.com/upload/v2/publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_EXTENSION_ID }}
    steps:
    - name: 📥 Download ZIP Artifact
      uses: actions/download-artifact@v8
      with:
        name: gather-and-join-${{ inputs.version }}-chrome

    - name: 🔑 Authenticate to Google
      id: google
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
        token_format: access_token
        access_token_scopes: https://www.googleapis.com/auth/chromewebstore

    - name: 🏪 Upload Draft
      env:
        TOKEN: ${{ steps.google.outputs.access_token }}
      run: |
        archive="gather-and-join-$releaseVersion-chrome.zip"
        status() { curl -fsS -H "Authorization: Bearer $TOKEN" "$item:fetchStatus"; }

        # The store holds one submission at a time: while one is in review, a new package
        # is refused. Leave it be rather than cancel someone's review; this release's ZIP
        # stays on the GitHub release, and the next release uploads as usual.
        submitted=$(status | jq -r '.submittedItemRevisionStatus.state // empty')
        if [[ "$submitted" == PENDING_REVIEW ]]; then
          echo "::warning::A submission is in review; $releaseVersion was not uploaded to the store"
          echo "⏸️ Store upload skipped: a submission is in review" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        response=$(curl -sS -w '\n%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" \
          -T "$archive" "$upload:upload")
        code=$(tail -n1 <<<"$response")
        body=$(sed '$d' <<<"$response")
        if [[ "$code" != 200 ]]; then
          echo "::error::Store upload failed (HTTP $code): $(jq -c '.error // .' <<<"$body")"
          exit 1
        fi

        # Large packages are processed asynchronously. The reference names the pending
        # state both UPLOAD_IN_PROGRESS and IN_PROGRESS, so accept either.
        state=$(jq -r '.uploadState' <<<"$body")
        for _ in $(seq 1 30); do
          [[ "$state" == UPLOAD_IN_PROGRESS || "$state" == IN_PROGRESS ]] || break
          sleep 5
          state=$(status | jq -r '.lastAsyncUploadState')
        done
        if [[ "$state" != SUCCEEDED ]]; then
          echo "::error::Store upload ended in state $state: $body"
          exit 1
        fi
        echo "🏪 Uploaded \`$archive\` to the store as a draft; submit it for review from the Developer Dashboard" \
          | tee -a "$GITHUB_STEP_SUMMARY"

  package-server:
    name: Package Server
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      releaseVersion: ${{ inputs.version }}
      releaseTag: v${{ inputs.version }}
    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ env.releaseTag }}

    - name: 🧰 Setup
      uses: ./.github/actions/setup

    # One file with no dependencies: hosting the server should not require cloning this repo.
    - name: 📦 Bundle Server
      run: pnpm --filter @gj/server build

    - name: ✅ Verify Bundle
      run: |
        bundle="apps/server/dist/gj-server.mjs"
        # It has to start on a bare Node and answer the same health check the hosting
        # platforms use — a bundle that only imports cleanly is not a bundle that runs.
        PORT=18099 node "$bundle" &
        server=$!
        trap 'kill $server 2>/dev/null' EXIT
        for _ in $(seq 1 40); do
          health=$(curl -fsS http://127.0.0.1:18099/health 2>/dev/null) && break
          sleep 0.25
        done
        if [[ -z "${health:-}" ]]; then
          echo "::error::Bundled server never answered /health"
          exit 1
        fi
        packedVersion=$(jq -r '.version' <<<"$health")
        if [[ "$packedVersion" != "$releaseVersion" ]]; then
          echo "::error::Bundle reports version $packedVersion, expected $releaseVersion"
          exit 1
        fi

        expected="gather-and-join-server-$releaseVersion.mjs"
        mv "$bundle" "$expected"
        echo "SERVER_BUNDLE=$expected" >> "$GITHUB_ENV"
        echo "✅ Bundled \`$expected\` ($(du -h "$expected" | cut -f1))" | tee -a "$GITHUB_STEP_SUMMARY"

    - name: 🗂️ Upload Bundle Artifact
      uses: actions/upload-artifact@v7
      with:
        name: gather-and-join-server-${{ env.releaseVersion }}
        path: ${{ env.SERVER_BUNDLE }}

    - name: 📎 Attach Bundle to Release
      run: gh release upload "$releaseTag" "$SERVER_BUNDLE" --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-server-image:
    name: Publish Server Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v7
      with:
        ref: v${{ inputs.version }}

    # arm64 covers Apple silicon and the cheap ARM instances most always-on hosts end up on.
    - name: 🧰 Setup Buildx
      uses: docker/setup-buildx-action@v4

    - name: 🔑 Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🏷️ Image Tags
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}-server
        tags: |
          type=raw,value=${{ inputs.version }}
          type=raw,value=latest
          type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}

    - name: 🐳 Build and Push
      uses: docker/build-push-action@v7
      with:
        context: .
        file: apps/server/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: 📄 Summary
      run: |
        echo "🐳 Pushed \`ghcr.io/${{ github.repository }}-server:${{ inputs.version }}\`" | tee -a "$GITHUB_STEP_SUMMARY"
