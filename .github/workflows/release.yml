name: 🚀 Release
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  # Releases run one at a time and are never cancelled halfway through.
  group: release
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  create-release:
    name: Release
    needs: checks
    uses: ./.github/workflows/versioning-semver.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Permissions cap the whole nested chain, not just the next workflow down:
      # this one reaches release.yml → versioning-semver.yml → packaging.yml, and
      # the GHCR push at the bottom needs it. Without it GitHub rejects the run
      # before any job starts (startup_failure), so the release never happens.
      packages: write
    secrets: inherit
